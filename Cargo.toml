[package]
name = "sdm-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Command-line client for the Akeneo Supplier Data Manager (SDM) API, for people and LLM agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Snidd/sdm-cli"
readme = "README.md"
keywords = ["akeneo", "sdm", "cli", "openapi", "pim"]
categories = ["command-line-utilities"]
exclude = ["/.sdmhistory", "/.sdm-scope.json"]

[dependencies]
clap = { version = "4.6.7", features = ["string", "env", "cargo"] }
dirs = "7.0.0"
inquire = { version = "0.9.5", default-features = false, features = ["crossterm", "fuzzy"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "multipart", "rustls", "query", "gzip"] }
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"

[[bin]]
name = "sdm"
path = "src/main.rs"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
